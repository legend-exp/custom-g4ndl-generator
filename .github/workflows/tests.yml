name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run tests
        run: pytest -q

  pre-commit:
    name: pre-commit (black + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  draw-comparison:
    name: draw-comparison
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,plot]'
      - name: Draw comparison
        run: python docs/examples/draw_comparison.py
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-plot
          path: docs/examples/comparison_plot.png
      - name: Commit updated plot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate comparison plot [skip ci]"
          file_pattern: docs/examples/comparison_plot.png

  docs:
    name: docs
    needs: draw-comparison     # build with the new plot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install '.[docs]'
      - uses: actions/download-artifact@v4
        with:
          name: comparison-plot
          path: docs/examples
      - name: Build
        run: sphinx-build -W docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
